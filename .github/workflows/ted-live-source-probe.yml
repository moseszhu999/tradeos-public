name: tradeOS TED live source probe

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/ted-live-source-probe-request.json

permissions:
  contents: read

concurrency:
  group: ted-live-source-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  ted-live-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted public main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1

      - name: Check out untrusted request head separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: request
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify request PR changes exactly one file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd request
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/ted-live-source-probe-request.json"

      - name: Run trusted fixed TED live probe
        run: |
          set -euo pipefail
          node trusted/scripts/ted-live-source-probe.mjs \
            request/.github/ted-live-source-probe-request.json
