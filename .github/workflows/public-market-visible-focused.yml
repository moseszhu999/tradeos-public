name: tradeOS public market visible focused CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/public-market-visible-focused-request.json

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: tradeos-visible-focused-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  visible-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted public base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Check out request head separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: request
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify request PR scope and parse trusted request
        id: request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd request
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/public-market-visible-focused-request.json"
          cd ..
          node trusted/scripts/public-market-visible-focused-profile.mjs request/.github/public-market-visible-focused-request.json > "$RUNNER_TEMP/visible-request.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const request = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/visible-request.json', 'utf8'));
          const line = (k, v) => appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
          line('request_id', request.requestId);
          line('target', request.target);
          line('private_sha', request.privateExactSha);
          line('base_sha', request.expectedBaseSha);
          line('changed_count', request.expectedChangedFileCount);
          line('test_file', request.testFile);
          line('test_runner', request.testRunner);
          NODE

      - name: Check out exact private head read-only
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/chaintrace-app
          ref: ${{ steps.request.outputs.private_sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Verify exact private head, merge base and changed-file count
        id: scope
        shell: bash
        env:
          PRIVATE_SHA: ${{ steps.request.outputs.private_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
          EXPECTED_COUNT: ${{ steps.request.outputs.changed_count }}
        run: |
          set -euo pipefail
          cd private-repo
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          count="$(git diff --name-only "$BASE_SHA" HEAD | wc -l | tr -d ' ')"
          test "$count" = "$EXPECTED_COUNT"
          echo "changed_count=$count" >> "$GITHUB_OUTPUT"

      - name: Run fixed focused visible-adapter profile with sealed logs
        id: profile
        shell: bash
        env:
          TEST_FILE: ${{ steps.request.outputs.test_file }}
          TEST_RUNNER: ${{ steps.request.outputs.test_runner }}
        run: |
          set +e
          cd private-repo
          passed=0
          failure=NONE
          dependency_lock=repository_lock

          if [[ ! -f package-lock.json ]]; then
            dependency_lock=ephemeral_package_lock
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/visible-dependency-lock.log" 2>&1
            if [[ "$?" -ne 0 ]]; then
              failure=dependency-lock
            fi
          fi

          run_stage() {
            name="$1"; shift
            "$@" > "$RUNNER_TEMP/visible-${name}.log" 2>&1
            code=$?
            if [[ "$code" -eq 0 ]]; then
              passed=$((passed+1))
              return 0
            fi
            failure="$name"
            return "$code"
          }

          if [[ "$failure" == NONE ]]; then run_stage npm-ci npm ci --no-audit --no-fund || true; fi
          if [[ "$failure" == NONE ]]; then
            case "$TEST_RUNNER" in
              vitest)
                run_stage focused-test npm test -- "$TEST_FILE" || true
                ;;
              hardhat)
                run_stage focused-test npm run contracts:test:node -- "$TEST_FILE" || true
                ;;
              *)
                failure=focused-runner-invalid
                ;;
            esac
          fi
          if [[ "$failure" == NONE ]]; then run_stage typecheck npm run typecheck || true; fi
          if [[ "$failure" == NONE ]]; then run_stage build npm run build || true; fi

          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failure=$failure" >> "$GITHUB_OUTPUT"
          echo "dependency_lock=$dependency_lock" >> "$GITHUB_OUTPUT"
          if [[ "$failure" == NONE && "$passed" -eq 4 ]]; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Publish sanitized verdict
        if: always()
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          TARGET: ${{ steps.request.outputs.target }}
          PRIVATE_SHA: ${{ steps.request.outputs.private_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
          CHANGED_COUNT: ${{ steps.scope.outputs.changed_count }}
          PASSED: ${{ steps.profile.outputs.passed }}
          FAILURE: ${{ steps.profile.outputs.failure }}
          DEPENDENCY_LOCK: ${{ steps.profile.outputs.dependency_lock }}
          VERDICT: ${{ steps.profile.outputs.verdict }}
        run: |
          printf '## tradeOS Public Market visible focused CI\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Request: `%s`\n- Target: **%s**\n- Private exact head: `%s`\n- Merge base: `%s`\n- Changed files: **%s**\n- Dependency lock: **%s**\n- Fixed stages: **%s/4**\n- Failure stage: **%s**\n- Final verdict: **%s**\n' "$REQUEST_ID" "$TARGET" "$PRIVATE_SHA" "$BASE_SHA" "$CHANGED_COUNT" "$DEPENDENCY_LOCK" "$PASSED" "$FAILURE" "$VERDICT" >> "$GITHUB_STEP_SUMMARY"
          echo "TRADEOS_VISIBLE_FOCUSED target=$TARGET verdict=$VERDICT dependency_lock=$DEPENDENCY_LOCK failure_stage=$FAILURE passed=$PASSED/4"

      - name: Comment sanitized verdict on carrier PR
        if: always()
        uses: actions/github-script@v7
        env:
          TARGET: ${{ steps.request.outputs.target }}
          PRIVATE_SHA: ${{ steps.request.outputs.private_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
          CHANGED_COUNT: ${{ steps.scope.outputs.changed_count }}
          DEPENDENCY_LOCK: ${{ steps.profile.outputs.dependency_lock }}
          PASSED: ${{ steps.profile.outputs.passed }}
          FAILURE: ${{ steps.profile.outputs.failure }}
          VERDICT: ${{ steps.profile.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const body = [
              '## tradeOS Public Market visible focused result',
              '',
              `- Controller run: ${process.env.RUN_URL}`,
              `- Target: **${process.env.TARGET || 'NOT_RUN'}**`,
              `- Exact private SHA: \`${process.env.PRIVATE_SHA || 'NOT_RUN'}\``,
              `- Exact merge base: \`${process.env.BASE_SHA || 'NOT_RUN'}\``,
              `- Changed files: **${process.env.CHANGED_COUNT || 'NOT_RUN'}**`,
              `- Dependency lock: **${process.env.DEPENDENCY_LOCK || 'NOT_RUN'}**`,
              `- Fixed stages: **${process.env.PASSED || '0'}/4**`,
              `- Failure stage: **${process.env.FAILURE || 'NOT_RUN'}**`,
              `- Final verdict: **${process.env.VERDICT || 'NOT_RUN'}**`,
              '',
              'Raw private output stayed runner-local and sealed. No deployment, migration, database write, persistence, publication, notification or external action was performed.',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

      - name: Delete private checkout and sealed logs
        if: always()
        shell: bash
        run: |
          chmod -R u+rwX private-repo "$RUNNER_TEMP"/visible-*.log 2>/dev/null || true
          rm -rf private-repo
          rm -f "$RUNNER_TEMP"/visible-request.json "$RUNNER_TEMP"/visible-*.log

      - name: Enforce final verdict
        if: always()
        shell: bash
        env:
          VERDICT: ${{ steps.profile.outputs.verdict }}
        run: |
          [[ "$VERDICT" == PASS ]]
